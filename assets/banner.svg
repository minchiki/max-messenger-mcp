<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0820"/><stop offset=".55" stop-color="#1A0F3A"/><stop offset="1" stop-color="#2A1A52"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".35" r=".55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".55"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="84" width="196" height="40" rx="20" fill="#8B5CF6" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="170" y="110" text-anchor="middle" font-size="17" font-weight="600" fill="#E9D5FF" letter-spacing="1.5">MCP-СЕРВЕР</text>
    <text x="72" y="222" font-size="88" font-weight="800" fill="url(#title)">MAX</text>
    <text x="72" y="300" font-size="56" font-weight="800" fill="#FFFFFF">в ChatGPT и Claude</text>
    <text x="72" y="356" font-size="25" fill="#C4B5FD">Личный аккаунт MAX для ИИ-ассистента:</text>
    <text x="72" y="390" font-size="25" fill="#C4B5FD">читать, искать, отвечать, вести группы.</text>
    <g font-size="20" font-weight="600" fill="#F5F3FF">
      <rect x="72" y="438" width="184" height="46" rx="23" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".45"/>
      <text x="164" y="468" text-anchor="middle">56 инструментов</text>
      <rect x="270" y="438" width="166" height="46" rx="23" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".45"/>
      <text x="353" y="468" text-anchor="middle">живая лента</text>
      <rect x="450" y="438" width="130" height="46" rx="23" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".45"/>
      <text x="515" y="468" text-anchor="middle">~50 мс</text>
    </g>
    <text x="72" y="566" font-size="20" fill="#A78BFA">github.com/minchiki/max-messenger-mcp  ·  t.me/huicoding</text>
    <g transform="translate(720 118)">
      <rect width="488" height="404" rx="28" fill="url(#card)" stroke="#A78BFA" stroke-opacity=".35"/>
      <circle cx="34" cy="34" r="7" fill="#F472B6"/><circle cx="58" cy="34" r="7" fill="#FBBF24"/><circle cx="82" cy="34" r="7" fill="#A78BFA"/>
      <text x="460" y="40" text-anchor="end" font-size="16" fill="#C4B5FD">MAX · ассистент</text>
      <rect x="28" y="70" width="330" height="58" rx="18" fill="#FFFFFF" fill-opacity=".09"/>
      <text x="48" y="106" font-size="19" fill="#F5F3FF">Что непрочитанного в MAX?</text>
      <rect x="100" y="146" width="360" height="104" rx="18" fill="#7C3AED" fill-opacity=".55"/>
      <text x="120" y="180" font-size="18" fill="#FFFFFF">3 чата: Даниил прислал</text>
      <text x="120" y="206" font-size="18" fill="#FFFFFF">домашку, в группе опрос,</text>
      <text x="120" y="232" font-size="18" fill="#FFFFFF">код подтверждения VK ID.</text>
      <rect x="28" y="268" width="300" height="58" rx="18" fill="#FFFFFF" fill-opacity=".09"/>
      <text x="48" y="304" font-size="19" fill="#F5F3FF">Ответь Даниилу «спасибо»</text>
      <rect x="196" y="344" width="264" height="40" rx="14" fill="#A78BFA" fill-opacity=".3"/>
      <text x="216" y="370" font-size="17" fill="#E9D5FF">✓ max_send_message</text>
    </g>
  </g>
</svg>
