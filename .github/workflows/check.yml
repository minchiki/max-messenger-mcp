name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: tools register
        working-directory: app
        env:
          MAX_SECRET: ci-secret-ci-secret-ci-secret-00
        run: |
          python - <<'EOF'
          import asyncio, sys
          sys.argv = ["server.py"]
          import server
          tools = asyncio.run(server.mcp.list_tools())
          print(len(tools), "tools")
          assert len(tools) >= 56
          EOF
      - name: read-only mode
        working-directory: app
        env:
          MAX_SECRET: ci-secret-ci-secret-ci-secret-00
          READ_ONLY: "1"
        run: |
          python - <<'EOF'
          import asyncio, sys
          sys.argv = ["server.py"]
          import server
          tools = asyncio.run(server.mcp.list_tools())
          assert all(t.annotations.read_only_hint for t in tools), "write tool leaked into READ_ONLY"
          print(len(tools), "read-only tools")
          EOF
      - name: shell syntax
        run: for f in deploy/*.sh; do bash -n "$f"; done
