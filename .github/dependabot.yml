version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # maxapi-python закреплён на 2.5.x: cfg.py правит его внутреннюю модель пересылки
    ignore:
      - dependency-name: maxapi-python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
